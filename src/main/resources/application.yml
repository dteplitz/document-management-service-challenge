spring:
  application:
    name: document-management-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Pool is intentionally tight: 10 concurrent uploads must not translate
      # into 10 open DB connections. Queries are short and index-backed,
      # queuing is acceptable. See Slice 0 refinement.
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 10000

  jpa:
    hibernate:
      # Schema is created by docker/init-scripts/schema-init.sql.
      # Hibernate only validates that entity definitions match.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          lob:
            non_contextual_creation: true
        cache:
          use_second_level_cache: false
          use_query_cache: false
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      # 1 byte threshold: any part larger than 1 byte is written to disk immediately.
      # Using 1 instead of 0 avoids a Tomcat edge case where literal zero disables spill.
      file-size-threshold: 1
      location: ${java.io.tmpdir}/multipart
      max-file-size: 500MB
      max-request-size: 505MB
      # Defer multipart resolution until @RequestPart parameters are accessed in the controller.
      # Combined with UploadAdmissionFilter, this ensures multipart parsing only begins for
      # requests that have already been admitted through the concurrency gate.
      resolve-lazily: true

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

minio:
  endpoint: ${MINIO_ENDPOINT}
  # Public base URL used in pre-signed download URLs returned to clients.
  # Set this when the MinIO client connects via an internal hostname (e.g. "http://minio:9000"
  # inside Docker) but callers need a publicly reachable URL (e.g. "http://localhost:9000").
  # Omit or leave blank when endpoint is already publicly reachable (e.g. local dev).
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:document-bucket}
  # MinIO default region. Required for AWS Signature V4 pre-signed URL generation.
  region: ${MINIO_REGION:us-east-1}
  # TTL for pre-signed download URLs. Overridable via MINIO_PRESIGNED_URL_EXPIRY_SECONDS.
  presigned-url-expiry-seconds: ${MINIO_PRESIGNED_URL_EXPIRY_SECONDS:900}

upload:
  # HTTP admission gate — limits requests past the filter before multipart parsing begins.
  # Keeps heap bounded under concurrent load. See ADR-008.
  admission:
    max-concurrent: 1
    acquire-timeout-seconds: 15
  storage:
    # Maximum concurrent MinIO uploads. Each slot consumes ~5 MB of heap (one part buffer).
    # 3 slots = 15 MB peak; leaves ~35 MB for the rest of the JVM working set.
    # Tune based on load test results — see ADR-007.
    max-concurrent: 3

logging:
  level:
    root: WARN
    com.clara.ops.challenge: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
