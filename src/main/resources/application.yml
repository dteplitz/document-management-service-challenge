spring:
  application:
    name: document-management-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Pool is intentionally tight: 10 concurrent uploads must not translate
      # into 10 open DB connections. Queries are short and index-backed,
      # queuing is acceptable. See Slice 0 refinement.
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 10000

  jpa:
    hibernate:
      # Schema is created by docker/init-scripts/schema-init.sql.
      # Hibernate only validates that entity definitions match.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          lob:
            non_contextual_creation: true
        cache:
          use_second_level_cache: false
          use_query_cache: false
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      # threshold 0 = every uploaded part is written to disk immediately,
      # never buffered in JVM heap. Foundation of the streaming pipeline.
      file-size-threshold: 0
      location: /tmp/multipart
      max-file-size: 500MB
      max-request-size: 505MB

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:document-bucket}

upload:
  storage:
    # Maximum concurrent MinIO uploads. Each slot consumes ~5 MB of heap (one part buffer).
    # 3 slots = 15 MB peak; leaves ~35 MB for the rest of the JVM working set.
    # Tune based on load test results — see ADR-007.
    max-concurrent: 3

logging:
  level:
    root: WARN
    com.clara.ops.challenge: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
