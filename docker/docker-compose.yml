services:
  postgresql:
    container_name: postgresql_container
    image: postgres:15
    ports:
      - "5432:5432"
    networks:
      - batch_network
    volumes:
      - challenge_postgresql_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=challenge
      - APP_DB_PASSWORD=${APP_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d challenge"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    ports:
      - "9000:9000"  # API S3
      - "9001:9001"  # MinIO Web Console
    networks:
      - batch_network
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server --console-address ":9001" /data
    volumes:
      - challenge_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -----------------------------------------------------------------------------
  # MinIO bootstrap — one-shot init container.
  # Follows docs/minio-local-setup.md: creates the bucket and provisions a
  # dedicated service account so the application never uses root credentials
  # at runtime. Runs once per `docker-compose up`, idempotent.
  # -----------------------------------------------------------------------------
  minio-bootstrap:
    image: minio/mc:latest
    container_name: minio_bootstrap
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - batch_network
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        echo 'Configuring mc alias for local MinIO...'
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        echo 'Ensuring bucket document-bucket exists...'
        mc mb --ignore-existing local/document-bucket
        echo 'Provisioning application service account...'
        mc admin user svcacct add local "$$MINIO_ROOT_USER" \
            --access-key "$$MINIO_APP_ACCESS_KEY" \
            --secret-key "$$MINIO_APP_SECRET_KEY" \
            || echo 'Service account already exists, continuing.'
        echo 'MinIO bootstrap complete.'
    restart: "no"

  document-management-service:
    container_name: document-management-service
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - batch_network
    depends_on:
      postgresql:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    environment:
      # Datasource
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/challenge?currentSchema=document_schema
      SPRING_DATASOURCE_USERNAME: document_user
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD}
      # MinIO — application service account (NOT root); provisioned by minio-bootstrap.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_APP_SECRET_KEY}
      MINIO_BUCKET: document-bucket
      MINIO_REGION: ${MINIO_REGION:us-east-1}
      # Server
      SERVER_PORT: 8080
    deploy:
      resources:
        # See ADR-006: the heap is strictly capped at 50MB via the Dockerfile
        # ENTRYPOINT (-Xmx50m -Xms50m), but the container limit is raised to
        # 384MB to accommodate unavoidable JVM overhead (metaspace, code cache,
        # direct buffers, thread stacks). The heap is what actually governs
        # the streaming upload pipeline.
        limits:
          memory: 384M

volumes:
  challenge_postgresql_data:
    driver: local
  challenge_minio_data:
    driver: local

networks:
  batch_network:
    driver: bridge
